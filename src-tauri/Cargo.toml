[package]
name = "acute-code"
version = "0.1.0"
description = "ACUTE-CODE desktop shell: window + sidecar lifecycle only"
edition = "2021"

[lib]
name = "acute_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"