name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: License audit
        run: pnpm audit:licenses

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build

      - name: Rust check (skipped until src-tauri/Cargo.toml exists)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        continue-on-error: false
        working-directory: src-tauri
        run: cargo check